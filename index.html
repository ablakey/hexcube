<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9×9×9 Cube of Cubes</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #ddd;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        pointer-events: none;
        user-select: none;
      }
      #toggle {
        position: absolute;
        top: 40px;
        left: 10px;
        padding: 8px 12px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: #eee;
        background: #2a2a2a;
        border: 1px solid #555;
        border-radius: 4px;
        cursor: pointer;
      }
      #toggle:hover {
        background: #383838;
      }
      #reset {
        position: absolute;
        top: 40px;
        left: 320px;
        padding: 8px 12px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: #eee;
        background: #2a2a2a;
        border: 1px solid #555;
        border-radius: 4px;
        cursor: pointer;
      }
      #reset:hover {
        background: #383838;
      }
      #hover {
        position: absolute;
        top: 80px;
        left: 10px;
        padding: 6px 10px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        color: #eee;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 4px;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="info">Drag to rotate • Scroll to zoom • Right-drag to pan · always looking at (0,0,0)</div>
    <button id="toggle">Hide cubes whose coords don't sum to 0</button>
    <button id="reset">Reset view</button>
    <div id="hover">Hover a cube…</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111111);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(14, 12, 16);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Orbit controls: always look at 0,0,0
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.update();

      // Remember the initial view for the reset button.
      const INITIAL_CAMERA_POS = camera.position.clone();
      const INITIAL_TARGET = controls.target.clone();
      document.getElementById("reset").addEventListener("click", () => {
        camera.position.copy(INITIAL_CAMERA_POS);
        controls.target.copy(INITIAL_TARGET);
        controls.update();
      });

      // Lights
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(10, 20, 15);
      scene.add(dirLight);
      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
      dirLight2.position.set(-15, -10, -12);
      scene.add(dirLight2);

      // Build the 9x9x9 grid of unit cubes.
      // Centers at whole coordinates from -4..4, middle cube centered at (0,0,0).
      const N = 9;
      const HALF = (N - 1) / 2; // 4

      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const edgeGeometry = new THREE.EdgesGeometry(geometry);
      const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x000000 });

      const group = new THREE.Group();

      for (let x = -HALF; x <= HALF; x++) {
        for (let y = -HALF; y <= HALF; y++) {
          for (let z = -HALF; z <= HALF; z++) {
            // Color each cube based on its position for visual clarity.
            const color = new THREE.Color();
            color.setRGB((x + HALF) / (N - 1), (y + HALF) / (N - 1), (z + HALF) / (N - 1));

            const material = new THREE.MeshStandardMaterial({
              color,
              roughness: 0.6,
              metalness: 0.1,
            });

            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);
            cube.userData.sumsToZero = x + y + z === 0;
            cube.userData.baseEmissive = material.emissive.clone();

            const edges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
            cube.add(edges);

            group.add(cube);
          }
        }
      }

      scene.add(group);

      // Toggle visibility of cubes whose coordinates do not sum to 0.
      let othersHidden = false;
      const toggleButton = document.getElementById("toggle");
      toggleButton.addEventListener("click", () => {
        othersHidden = !othersHidden;
        for (const cube of group.children) {
          if (!cube.userData.sumsToZero) {
            cube.visible = !othersHidden;
          }
        }
        toggleButton.textContent = othersHidden
          ? "Show cubes whose coords don't sum to 0"
          : "Hide cubes whose coords don't sum to 0";
      });

      // Raycasting to report the coordinate of the hovered cube.
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const hoverReadout = document.getElementById("hover");
      let hasPointer = false;

      renderer.domElement.addEventListener("pointermove", (event) => {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        hasPointer = true;
      });

      renderer.domElement.addEventListener("pointerleave", () => {
        hasPointer = false;
        hoverReadout.textContent = "Hover a cube…";
      });

      // Track the currently highlighted cube so we can restore it.
      let hovered = null;
      const HIGHLIGHT = new THREE.Color(0xffff66);

      function setHovered(cube) {
        if (hovered === cube) return;
        if (hovered) {
          hovered.material.emissive.copy(hovered.userData.baseEmissive);
        }
        hovered = cube;
        if (hovered) {
          hovered.material.emissive.copy(HIGHLIGHT);
        }
      }

      // Handle resize
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();

        if (hasPointer) {
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(group.children, false);
          const hit = hits.find((h) => h.object.visible);
          if (hit) {
            const p = hit.object.position;
            hoverReadout.textContent = `(${p.x}, ${p.y}, ${p.z})`;
            setHovered(hit.object);
          } else {
            hoverReadout.textContent = "Hover a cube…";
            setHovered(null);
          }
        } else {
          setHovered(null);
        }

        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
